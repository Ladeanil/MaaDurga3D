
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maa Durga - Divine Reveal</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: #09020d;
      color: white;
      font-family: Georgia, serif;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      isolation: isolate;
      background:
        radial-gradient(ellipse at center, #651b31 0%, #260b25 38%, #09020d 78%);
    }

    .scene::before {
      content: "";
      position: absolute;
      width: min(75vw, 620px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(255, 188, 68, 0.25),
        rgba(240, 74, 30, 0.12) 42%,
        transparent 70%
      );
      animation: breathe 4s ease-in-out infinite alternate;
      z-index: -1;
    }

    .halo {
      position: absolute;
      width: min(64vw, 480px);
      aspect-ratio: 1;
      border: 2px solid rgba(255, 190, 83, 0.7);
      border-radius: 50%;
      box-shadow:
        0 0 20px #ff9e36,
        inset 0 0 35px rgba(255, 145, 30, 0.4),
        0 0 90px rgba(255, 73, 25, 0.3);
      opacity: 0;
      animation: haloReveal 2s ease 0.5s forwards,
                 rotateHalo 35s linear infinite;
    }

    .halo::before,
    .halo::after {
      content: "";
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(255, 217, 136, 0.45);
      border-radius: 50%;
    }

    .halo::after {
      inset: 28px;
      border-style: dashed;
      border-color: rgba(255, 164, 53, 0.55);
    }

    .goddess {
      position: relative;
      width: min(90vw, 540px);
      height: min(78vh, 690px);
      height: min(78dvh, 690px);
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1000px;
      transform-style: preserve-3d;
    }

    .layer {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      opacity: 0;
      filter: drop-shadow(0 0 16px rgba(255, 135, 44, 0.25));
      transform: translateY(35px) scale(0.92);
      animation: reveal 1.6s cubic-bezier(.2,.8,.2,1) forwards;
    }

    /* The images are layered to create a cinematic depth effect. */
    .saree {
      z-index: 1;
      animation-delay: 1.1s;
    }

    .lion {
      z-index: 2;
      width: 88%;
      height: 65%;
      left: -10%;
      top: 28%;
      animation-delay: 2s;
    }

    .arms {
      z-index: 3;
      animation-delay: 2.8s;
    }

    .face {
      z-index: 4;
      animation-delay: 3.6s;
    }

    
      .crown {
  z-index: 5;
  width: 58%;
  height: 58%;
  top: -5%;
  left: 21%;
  animation-delay: 4.3s;

    }

    .caption {
      position: absolute;
      z-index: 10;
      bottom: max(25px, env(safe-area-inset-bottom));
      width: 100%;
      text-align: center;
      padding: 12px;
      font-size: clamp(22px, 4vw, 38px);
      letter-spacing: 3px;
      color: #ffe2a0;
      text-shadow: 0 0 12px #ff641e, 0 0 35px #ff3c19;
      opacity: 0;
      animation: captionReveal 2s ease 5.4s forwards;
    }

    .caption small {
      display: block;
      margin-top: 9px;
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 5px;
      color: #ffc86b;
    }

    .particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 7;
    }

    .particle {
      position: absolute;
      bottom: -15px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #ffd27c;
      box-shadow: 0 0 8px 2px rgba(255, 132, 37, 0.7);
      animation: floatUp linear infinite;
    }

    .replay {
      position: absolute;
      top: max(18px, env(safe-area-inset-top));
      right: 18px;
      z-index: 20;
      padding: 10px 16px;
      border: 1px solid rgba(255, 207, 123, 0.6);
      border-radius: 30px;
      background: rgba(30, 7, 20, 0.7);
      color: #ffe1a0;
      cursor: pointer;
      font-size: 13px;
    }

    .replay:hover {
      background: rgba(128, 37, 35, 0.8);
    }

    .hint {
      position: absolute;
      z-index: 10;
      top: 22px;
      left: 18px;
      font: 10px Arial, sans-serif;
      letter-spacing: 3px;
      color: rgba(255, 220, 166, 0.7);
    }

    @keyframes reveal {
      0% {
        opacity: 0;
        transform: translateY(35px) scale(0.92) rotateY(8deg);
      }
      70% {
        opacity: 1;
        transform: translateY(-4px) scale(1.02) rotateY(0deg);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1) rotateY(0deg);
      }
    }

    @keyframes haloReveal {
      from { opacity: 0; transform: scale(0.65); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes rotateHalo {
      from { rotate: 0deg; }
      to { rotate: 360deg; }
    }

    @keyframes breathe {
      from { transform: scale(0.9); opacity: 0.55; }
      to { transform: scale(1.1); opacity: 1; }
    }

    @keyframes captionReveal {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes floatUp {
      from { transform: translateY(0) translateX(0); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 0.8; }
      to { transform: translateY(-105vh) translateX(35px); opacity: 0; }
    }

    @media (max-width: 600px) {
      .goddess {
        width: 100vw;
        height: 72dvh;
      }

      .halo {
        width: 75vw;
      }

      .caption {
        letter-spacing: 1px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .particle {
        animation-duration: 20s;
      }
    }
    

/* Cinematic divine arrival */
.goddess {
  perspective: 1200px;
  transform-style: preserve-3d;
  overflow: visible;
}

.durga-full {
  position: absolute;
  width: min(82vw, 650px);
  max-height: 84vh;
  height: auto;
  object-fit: contain;

  left: 50%;
  top: 50%;
  z-index: 3;

  opacity: 0;
  transform:
    translate(-50%, -38%)
    scale(0.72)
    rotateX(5deg);

  filter: brightness(0.35) blur(10px)
          drop-shadow(0 0 0 rgba(255, 170, 50, 0));

  transform-origin: center center;
  will-change: transform, opacity, filter;

  animation:
    divineArrival 3.5s cubic-bezier(.16, 1, .3, 1)
    0.4s forwards,
    divineBreath 5s ease-in-out 4s infinite;
}

@keyframes divineArrival {
  0% {
    opacity: 0;
    transform: translate(-50%, -25%) scale(0.65) rotateX(8deg);
    filter: brightness(0.25) blur(12px)
            drop-shadow(0 0 0 rgba(255, 170, 50, 0));
  }

  55% {
    opacity: 1;
    filter: brightness(1.2) blur(0)
            drop-shadow(0 0 35px rgba(255, 175, 60, 0.65));
  }

  78% {
    transform: translate(-50%, -47%) scale(1.025) rotateX(0deg);
  }

  100% {
    opacity: 1;
    transform: translate(-50%, -45%) scale(1) rotateX(0deg);
    filter: brightness(1) blur(0)
            drop-shadow(0 0 22px rgba(255, 175, 60, 0.3));
  }
}

@keyframes divineBreath {
  0%, 100% {
    transform: translate(-50%, -45%) scale(1);
    filter: brightness(1)
            drop-shadow(0 0 22px rgba(255, 175, 60, 0.3));
  }

  50% {
    transform: translate(-50%, -46%) scale(1.012);
    filter: brightness(1.08)
            drop-shadow(0 0 38px rgba(255, 190, 80, 0.5));
  }
}

@media (prefers-reduced-motion: reduce) {
  .durga-full {
    animation: none;
    opacity: 1;
    transform: translate(-50%, -45%) scale(1);
    filter: none;
  }
}


/* ===== MA DURGA CINEMATIC UPGRADE ===== */

.scene {
  isolation: isolate;
  background: #08010b;
  overflow: hidden;
}

/* Fill the screen with a blurred, atmospheric version
   of the artwork instead of a plain dark background. */
.scene::after {
  content: "";
  position: absolute;
  inset: -45px;
  z-index: -2;
  pointer-events: none;
  background: url("durga-full.png") center 42% / cover no-repeat;
  filter: blur(28px) brightness(0.24) saturate(1.4);
  opacity: 0.9;
  transform: scale(1.08);
  animation: cinematicBackground 20s ease-in-out infinite alternate;
}

/* The artwork already has its own halo and text. */
.halo,
.caption {
  display: none !important;
}

/* Let the goddess occupy the full stage. */
.goddess {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  max-width: none;
  max-height: none;
  z-index: 2;
  display: block;
  perspective: 1200px;
  transform-style: preserve-3d;
}

/* A warm aura awakens behind the artwork. */
.goddess::after {
  content: "";
  position: absolute;
  z-index: 1;
  pointer-events: none;
  width: min(90vw, 760px);
  aspect-ratio: 1;
  left: 50%;
  top: 48%;
  border-radius: 50%;
  background: radial-gradient(
    circle,
    rgba(255, 190, 75, 0.30),
    rgba(255, 100, 30, 0.13) 38%,
    transparent 72%
  );
  filter: blur(12px);
  opacity: 0;
  transform: translate(-50%, -50%) scale(0.5);
  animation: auraIgnite 2.5s ease-out 0.2s forwards,
             auraPulse 5s ease-in-out 3s infinite;
}

/* Dramatic rising reveal and slow camera push. */
.durga-full {
  position: absolute;
  z-index: 3;
  left: 50%;
  top: 50%;
  width: auto;
  height: 96vh;
  max-height: 96vh;
  max-width: 94vw;
  object-fit: contain;
  object-position: center;
  opacity: 0;
  transform: translate(-50%, -36%) scale(0.76) rotateX(7deg);
  transform-origin: center 55%;
  filter: brightness(0.35) blur(10px);
  will-change: transform, opacity, filter;

  animation: durgaArrival 3.8s cubic-bezier(0.16, 1, 0.3, 1)
             0.3s forwards,
             durgaEnergy 7s ease-in-out 4.3s infinite;
}

/* Rise from darkness, then settle with a gentle overshoot. */
@keyframes durgaArrival {
  0% {
    opacity: 0;
    transform: translate(-50%, -32%) scale(0.72) rotateX(8deg);
    filter: brightness(0.25) blur(12px);
  }

  45% {
    opacity: 1;
    filter: brightness(1.2) blur(0)
            drop-shadow(0 0 35px rgba(255, 175, 55, 0.7));
  }

  75% {
    transform: translate(-50%, -52%) scale(1.025) rotateX(0);
  }

  100% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1) rotateX(0);
    filter: brightness(1) blur(0)
            drop-shadow(0 0 20px rgba(255, 165, 50, 0.35));
  }
}

/* Very subtle divine energy; avoid shaking the image. */
@keyframes durgaEnergy {
  0%, 100% {
    transform: translate(-50%, -50%) scale(1);
    filter: brightness(1)
            drop-shadow(0 0 20px rgba(255, 165, 50, 0.3));
  }

  50% {
    transform: translate(-50%, -51%) scale(1.012);
    filter: brightness(1.07)
            drop-shadow(0 0 35px rgba(255, 185, 75, 0.55));
  }
}

/* Halo glow behind the goddess. */
@keyframes auraIgnite {
  0% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.45);
  }

  60% {
    opacity: 0.95;
    transform: translate(-50%, -50%) scale(1.08);
  }

  100% {
    opacity: 0.65;
    transform: translate(-50%, -50%) scale(1);
  }
}

@keyframes auraPulse {
  0%, 100% {
    opacity: 0.45;
  }

  50% {
    opacity: 0.8;
  }
}

/* Slow background movement creates a camera-like feel. */
@keyframes cinematicBackground {
  from {
    transform: scale(1.08) translateY(0);
  }

  to {
    transform: scale(1.18) translateY(-12px);
  }
}

@media (max-width: 600px) {
  .durga-full {
    height: 92vh;
    max-width: 96vw;
  }
}

@media (prefers-reduced-motion: reduce) {
  .scene::after,
  .goddess::after,
  .durga-full {
    animation: none;
  }

  .durga-full {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    filter: none;
  }
}

  </style>
</head>

<body>
  <main class="scene" id="scene">
    <div class="halo"></div>
    <div class="hint">DIVINE REVEAL</div>

    <button class="replay" id="replay" type="button">
      ↻ Replay
    </button>

    
<div class="goddess" id="goddess">
  <img
    class="durga-full"
    src="durga-full.png"
    alt="Maa Durga with her divine lion"
  >
</div>


    <div class="particles" id="particles"></div>

    <div class="caption" id="caption">
      ॥ जय माता दी ॥
      <small>JAI MATA DI</small>
    </div>
  </main>

  <script>
    const particles = document.getElementById("particles");
    const replayButton = document.getElementById("replay");
    const scene = document.getElementById("scene");

    // Create floating golden particles.
    for (let i = 0; i < 55; i++) {
      const particle = document.createElement("span");
      particle.className = "particle";
      particle.style.left = Math.random() * 100 + "%";
      particle.style.animationDuration = (5 + Math.random() * 8) + "s";
      particle.style.animationDelay = (Math.random() * 8) + "s";
      particle.style.opacity = Math.random();
      const size = (2 + Math.random() * 3) + "px";
      particle.style.width = size;
      particle.style.height = size;
      particles.appendChild(particle);
    }

    // Restart the reveal animation when Replay is clicked.
    replayButton.addEventListener("click", () => {
      const oldParticles = particles.innerHTML;
      const oldScene = scene.innerHTML;

      scene.innerHTML = oldScene;
            // Rebuild the scene and restart CSS animations.
      const newParticles = document.getElementById("particles");
      for (let i = 0; i < 55; i++) {
        const particle = document.createElement("span");
        particle.className = "particle";
        particle.style.left = Math.random() * 100 + "%";
        particle.style.animationDuration = (5 + Math.random() * 8) + "s";
        particle.style.animationDelay = (Math.random() * 8) + "s";
        newParticles.appendChild(particle);
      }

      document.getElementById("replay").addEventListener("click", () => {
        location.reload();
      });
    });
  </script>
</body>
</html>
